name: 🛠️ Task
description: Trabalho técnico sem mudança visível para o usuário — refatoração, dívida, testes, dependências, documentação
title: "[Task]: "
labels: ["task", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Task é trabalho que o usuário final não percebe diretamente.
        Se houver mudança de comportamento visível, abra uma **Feature**.
        Se algo está quebrado, abra um **Bug**.

  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: O que precisa ser feito, em uma ou duas frases.
      placeholder: Separar o repositório de Pedido em interfaces de leitura e escrita, como já está em Produto.
    validations:
      required: true

  - type: textarea
    id: justificativa
    attributes:
      label: Por que agora
      description: |
        O custo de não fazer. Task sem justificativa de prazo tende a nunca ser priorizada
        — ou a ser feita na hora errada.
      placeholder: |
        Bloqueia a issue #42: sem a separação, o novo relatório precisaria
        depender da interface de escrita só para ler.
    validations:
      required: true

  - type: dropdown
    id: categoria
    attributes:
      label: Categoria
      options:
        - "Refatoração / dívida técnica"
        - "Testes / cobertura"
        - "Atualização de dependência"
        - "Performance"
        - "Documentação"
        - "Ferramental / build / CI"
        - "Observabilidade / logs"
    validations:
      required: true

  - type: textarea
    id: escopo
    attributes:
      label: Escopo
      description: Arquivos, módulos ou serviços afetados. Seja específico o bastante para estimar.
      placeholder: |
        - src/Domain/Repositories/Pedido/
        - src/Infrastructure/Repositories/PedidoRepository.cs
        - tests/Repositories/
    validations:
      required: true

  - type: textarea
    id: definicao-de-pronto
    attributes:
      label: Definição de pronto
      description: |
        As condições objetivas para fechar esta issue. Comportamento externo deve
        permanecer idêntico em refatoração — diga como isso será comprovado.
      value: |
        - [ ] Comportamento externo inalterado (testes existentes passam sem edição)
        - [ ] CI verde, sem novos avisos
        - [ ] 
    validations:
      required: true

  - type: dropdown
    id: risco
    attributes:
      label: Risco de regressão
      options:
        - "Baixo — área isolada e coberta por testes"
        - "Médio — área compartilhada, cobertura parcial"
        - "Alto — caminho crítico ou sem cobertura de testes"
      default: 0
    validations:
      required: true

  - type: textarea
    id: dependencias
    attributes:
      label: Dependências e bloqueios
      description: Issues ou PRs que precisam entrar antes. Use `#numero`.

  - type: checkboxes
    id: confirmacoes
    attributes:
      label: Confirmações
      options:
        - label: Não há mudança de comportamento visível ao usuário
        - label: Pesquisei e não encontrei issue equivalente
          required: true
