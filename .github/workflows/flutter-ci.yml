name: Flutter CI (reutilizável)

# Uso no repositório consumidor:
#
#   jobs:
#     ci:
#       uses: dservis/.github/.github/workflows/flutter-ci.yml@main
#       permissions:
#         contents: read
#       with:
#         build-android: true
#         api-base-url: ${{ vars.API_BASE_URL }}
#
# Monorepo com vários pacotes/apps:
#
#       with:
#         working-directories: '["package/model", "project/caixa"]'
#
# Dependências em repositórios privados da organização (pubspec com git:):
#
#       with:
#         packages-app-id: ${{ vars.PACKAGES_APP_ID }}
#       secrets:
#         packages-app-private-key: ${{ secrets.PACKAGES_APP_PRIVATE_KEY }}
#
# A verificação a exigir nos rulesets é sempre "ci / verify",
# qualquer que seja a quantidade de pastas.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Pasta que contém o pubspec.yaml (repositório de um pacote só)
        type: string
        default: "."
      working-directories:
        description: 'Lista JSON de pastas para monorepo. Ex.: ["package/model", "project/app"]. Se informada, substitui working-directory na análise e nos testes'
        type: string
        default: ""
      channel:
        description: Canal do Flutter (stable, beta)
        type: string
        default: stable
      flutter-version:
        description: Versão exata do Flutter. Vazio = a mais recente do canal
        type: string
        default: ""
      fatal-infos:
        description: flutter analyze falha em apontamentos informativos
        type: boolean
        default: true
      fatal-warnings:
        description: flutter analyze falha em avisos
        type: boolean
        default: true
      check-format:
        description: Falha se o código não estiver formatado com dart format
        type: boolean
        default: true
      coverage:
        type: boolean
        default: true
      build-android:
        description: Gera o APK de release depois de análise e testes (usa working-directory)
        type: boolean
        default: false
      api-base-url:
        description: Valor de --dart-define=API_BASE_URL no build Android
        type: string
        default: ""
      packages-app-id:
        description: ID da GitHub App com leitura dos repositórios de pacotes privados
        type: string
        default: ""
    secrets:
      packages-app-private-key:
        description: Chave privada da GitHub App de pacotes (recomendado)
        required: false
      packages-token:
        description: Alternativa à App - token com leitura dos repositórios de pacotes
        required: false

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: analyze-and-test (${{ matrix.pasta }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEM_APP: ${{ inputs.packages-app-id != '' && secrets.packages-app-private-key != '' }}
      TEM_TOKEN: ${{ secrets.packages-token != '' }}
    strategy:
      fail-fast: false
      matrix:
        pasta: ${{ fromJSON(inputs.working-directories != '' && inputs.working-directories || format('["{0}"]', inputs.working-directory)) }}
    defaults:
      run:
        working-directory: ${{ matrix.pasta }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      # O GITHUB_TOKEN só lê o próprio repositório. Para pubspec com
      # dependência git em outro repositório privado da organização, gera um
      # token de leitura e faz o git usá-lo nas URLs da organização.
      - name: Private packages read token
        id: token-app
        if: env.TEM_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.packages-app-id }}
          private-key: ${{ secrets.packages-app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Private packages access
        if: env.TEM_APP == 'true' || env.TEM_TOKEN == 'true'
        env:
          TOKEN: ${{ steps.token-app.outputs.token || secrets.packages-token }}
        run: >
          git config --global
          url."https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}/".insteadOf
          "https://github.com/${{ github.repository_owner }}/"

      - name: Dependencies
        run: flutter pub get

      - name: Format
        if: inputs.check-format
        run: dart format --output=none --set-exit-if-changed .

      # flutter analyze já trata info e warning como fatais por padrão:
      # desligar exige a flag negativa explícita.
      - name: Static analysis
        run: >
          flutter analyze
          ${{ inputs.fatal-infos && '--fatal-infos' || '--no-fatal-infos' }}
          ${{ inputs.fatal-warnings && '--fatal-warnings' || '--no-fatal-warnings' }}

      - name: Tests
        id: testes
        run: |
          if [ ! -d test ]; then
            echo "::notice::No test folder in ${{ matrix.pasta }}; step skipped."
            exit 0
          fi
          flutter test ${{ inputs.coverage && '--coverage' || '' }}

      - name: Artifact name
        id: artefato
        if: always() && inputs.coverage
        run: echo "nome=flutter-coverage-$(echo '${{ matrix.pasta }}' | tr '/.' '--')" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artefato.outputs.nome }}
          path: ${{ matrix.pasta }}/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # Verificação única para os rulesets: consolida todas as pastas da matriz.
  verify:
    if: always()
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Analysis and test result
        run: |
          echo "Result: ${{ needs.analyze-and-test.result }}"
          test "${{ needs.analyze-and-test.result }}" = "success"

  build-android:
    if: inputs.build-android
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEM_APP: ${{ inputs.packages-app-id != '' && secrets.packages-app-private-key != '' }}
      TEM_TOKEN: ${{ secrets.packages-token != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      # O GITHUB_TOKEN só lê o próprio repositório. Para pubspec com
      # dependência git em outro repositório privado da organização, gera um
      # token de leitura e faz o git usá-lo nas URLs da organização.
      - name: Private packages read token
        id: token-app
        if: env.TEM_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.packages-app-id }}
          private-key: ${{ secrets.packages-app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Private packages access
        if: env.TEM_APP == 'true' || env.TEM_TOKEN == 'true'
        env:
          TOKEN: ${{ steps.token-app.outputs.token || secrets.packages-token }}
        run: >
          git config --global
          url."https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}/".insteadOf
          "https://github.com/${{ github.repository_owner }}/"

      - name: Dependencies
        run: flutter pub get

      - name: Release APK
        run: >
          flutter build apk --release
          ${{ inputs.api-base-url != '' && format('--dart-define=API_BASE_URL={0}', inputs.api-base-url) || '' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ inputs.working-directory }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
