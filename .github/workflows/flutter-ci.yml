name: Flutter CI (reutilizável)

# Uso no repositório consumidor:
#
#   jobs:
#     ci:
#       uses: dservis/.github/.github/workflows/flutter-ci.yml@v1
#       permissions:
#         contents: read
#       with:
#         build-android: true
#         api-base-url: ${{ vars.API_BASE_URL }}

on:
  workflow_call:
    inputs:
      working-directory:
        description: Pasta que contém o pubspec.yaml
        type: string
        default: "."
      channel:
        description: Canal do Flutter (stable, beta)
        type: string
        default: stable
      flutter-version:
        description: Versão exata do Flutter. Vazio = a mais recente do canal
        type: string
        default: ""
      fatal-infos:
        description: flutter analyze falha até em apontamentos informativos
        type: boolean
        default: true
      check-format:
        description: Falha se o código não estiver formatado com dart format
        type: boolean
        default: true
      coverage:
        type: boolean
        default: true
      build-android:
        description: Gera o APK de release depois de análise e testes
        type: boolean
        default: false
      api-base-url:
        description: Valor de --dart-define=API_BASE_URL no build Android
        type: string
        default: ""

permissions:
  contents: read

jobs:
  analise-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Formatação
        if: inputs.check-format
        run: dart format --output=none --set-exit-if-changed .

      - name: Análise estática
        run: flutter analyze ${{ inputs.fatal-infos && '--fatal-infos' || '' }}

      - name: Testes
        run: flutter test ${{ inputs.coverage && '--coverage' || '' }}

      - name: Publicar cobertura
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: ${{ inputs.working-directory }}/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  build-android:
    if: inputs.build-android
    needs: analise-e-testes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - run: flutter pub get

      - name: APK de release
        run: >
          flutter build apk --release
          ${{ inputs.api-base-url != '' && format('--dart-define=API_BASE_URL={0}', inputs.api-base-url) || '' }}

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ inputs.working-directory }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
