name: Flutter CI (reutilizável)

# Uso no repositório consumidor:
#
#   jobs:
#     ci:
#       uses: dservis/.github/.github/workflows/flutter-ci.yml@main
#       permissions:
#         contents: read
#       with:
#         build-android: true
#         api-base-url: ${{ vars.API_BASE_URL }}
#
# Monorepo com vários pacotes/apps:
#
#       with:
#         working-directories: '["package/model", "project/caixa"]'
#
# A verificação a exigir nos rulesets é sempre "ci / verificacao",
# qualquer que seja a quantidade de pastas.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Pasta que contém o pubspec.yaml (repositório de um pacote só)
        type: string
        default: "."
      working-directories:
        description: 'Lista JSON de pastas para monorepo. Ex.: ["package/model", "project/app"]. Se informada, substitui working-directory na análise e nos testes'
        type: string
        default: ""
      channel:
        description: Canal do Flutter (stable, beta)
        type: string
        default: stable
      flutter-version:
        description: Versão exata do Flutter. Vazio = a mais recente do canal
        type: string
        default: ""
      fatal-infos:
        description: flutter analyze falha em apontamentos informativos
        type: boolean
        default: true
      fatal-warnings:
        description: flutter analyze falha em avisos
        type: boolean
        default: true
      check-format:
        description: Falha se o código não estiver formatado com dart format
        type: boolean
        default: true
      coverage:
        type: boolean
        default: true
      build-android:
        description: Gera o APK de release depois de análise e testes (usa working-directory)
        type: boolean
        default: false
      api-base-url:
        description: Valor de --dart-define=API_BASE_URL no build Android
        type: string
        default: ""

permissions:
  contents: read

jobs:
  analise-e-testes:
    name: analise-e-testes (${{ matrix.pasta }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pasta: ${{ fromJSON(inputs.working-directories != '' && inputs.working-directories || format('["{0}"]', inputs.working-directory)) }}
    defaults:
      run:
        working-directory: ${{ matrix.pasta }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Formatação
        if: inputs.check-format
        run: dart format --output=none --set-exit-if-changed .

      # flutter analyze já trata info e warning como fatais por padrão:
      # desligar exige a flag negativa explícita.
      - name: Análise estática
        run: >
          flutter analyze
          ${{ inputs.fatal-infos && '--fatal-infos' || '--no-fatal-infos' }}
          ${{ inputs.fatal-warnings && '--fatal-warnings' || '--no-fatal-warnings' }}

      - name: Testes
        id: testes
        run: |
          if [ ! -d test ]; then
            echo "::notice::Sem pasta test em ${{ matrix.pasta }}; etapa ignorada."
            exit 0
          fi
          flutter test ${{ inputs.coverage && '--coverage' || '' }}

      - name: Nome do artefato
        id: artefato
        if: always() && inputs.coverage
        run: echo "nome=flutter-coverage-$(echo '${{ matrix.pasta }}' | tr '/.' '--')" >> "$GITHUB_OUTPUT"

      - name: Publicar cobertura
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artefato.outputs.nome }}
          path: ${{ matrix.pasta }}/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # Verificação única para os rulesets: consolida todas as pastas da matriz.
  verificacao:
    if: always()
    needs: analise-e-testes
    runs-on: ubuntu-latest
    steps:
      - name: Resultado da análise e dos testes
        run: |
          echo "Resultado: ${{ needs.analise-e-testes.result }}"
          test "${{ needs.analise-e-testes.result }}" = "success"

  build-android:
    if: inputs.build-android
    needs: analise-e-testes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.channel }}
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - run: flutter pub get

      - name: APK de release
        run: >
          flutter build apk --release
          ${{ inputs.api-base-url != '' && format('--dart-define=API_BASE_URL={0}', inputs.api-base-url) || '' }}

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ inputs.working-directory }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
